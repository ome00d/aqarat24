<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAJ COFFEE - Premium Digital Menu v1.4</title>
    
    <!-- Import NRT Font Webfont -->
    <style>
        @import url('https://db.onlinewebfonts.com/c/dc9a8bb1a3a65504c8d90566a26d5327?family=NRT+Reg');
    </style>

    <!-- Google Fonts for English Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #d4af37; /* Gold */
            --bg-dark: #07050d;       /* Ultimate Dark Charcoal */
            --bg-gradient: radial-gradient(circle at 50% 50%, #151025 0%, #07050d 100%);
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.05);
            --text-light: #f5ebe0;
            --text-muted: #a0a0a0;
            --hot-color: #ff6b6b;
            --cold-color: #4dadf7;
            --modal-bg: rgba(15, 12, 27, 0.98);
            --modal-border: rgba(255, 255, 255, 0.1);
            --btn-inactive: rgba(255, 255, 255, 0.04);
            --btn-inactive-border: rgba(255, 255, 255, 0.08);
            --topbar-bg: rgba(7, 5, 13, 0.85);
        }

        /* Day Mode Override */
        body.day-mode {
            --bg-dark: #fbfbfd;
            --bg-gradient: radial-gradient(circle at 50% 50%, #f4f4f9 0%, #e9e9f1 100%);
            --card-bg: rgba(0, 0, 0, 0.03);
            --card-border: rgba(0, 0, 0, 0.08);
            --text-light: #1d1d1f;
            --text-muted: #6e6e73;
            --modal-bg: rgba(255, 255, 255, 0.98);
            --modal-border: rgba(0, 0, 0, 0.1);
            --btn-inactive: rgba(0, 0, 0, 0.04);
            --btn-inactive-border: rgba(0, 0, 0, 0.08);
            --topbar-bg: rgba(244, 244, 249, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            background-image: var(--bg-gradient);
            color: var(--text-light);
            line-height: 1.6;
            background-attachment: fixed;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* NRT Font for Kurdish/Arabic Elements */
        body.rtl-layout, .rtl-layout .ku-text {
            font-family: 'NRT Reg', 'NRT Bold', 'Tajawal', sans-serif !important;
        }

        /* Fixed Top Navigation Bar (Tarteeb) */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: var(--topbar-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            z-index: 999;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        body.day-mode .top-bar {
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }

        .top-logo {
            font-size: 1.35rem;
            color: var(--primary-color);
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0px 2px 5px rgba(212, 175, 55, 0.1);
        }

        /* Settings Icon inside top-bar */
        .settings-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-light);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        body.day-mode .settings-btn {
            background: rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        .settings-btn:hover {
            background: var(--primary-color);
            color: #000;
            transform: rotate(45deg);
        }

        /* Main Header Section adjusted for topbar */
        header {
            text-align: center;
            padding: 110px 20px 40px; 
            border-bottom: 1px solid rgba(212, 175, 55, 0.12);
        }

        body.day-mode header {
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }

        .logo-area h1 {
            font-size: 3rem;
            color: var(--primary-color);
            letter-spacing: 4px;
            font-weight: 700;
            text-shadow: 0px 4px 12px rgba(212, 175, 55, 0.2);
        }

        .logo-area p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 5px;
            letter-spacing: 2px;
        }

        /* Navigation Tab Buttons (Tighter & Smaller - Tarteeb) */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 8px; /* Reduced gap */
            margin: 35px auto 10px;
            max-width: 600px;
            padding: 0 15px;
        }

        .tab-btn {
            background: var(--btn-inactive);
            border: 1px solid var(--btn-inactive-border);
            color: var(--text-light);
            padding: 8px 16px; /* Reduced from 12px 22px */
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.9rem; /* Reduced from 1.05rem */
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 6px; /* Reduced from 10px */
        }

        .tab-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.03);
        }

        .tab-btn.all-btn.active {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: #000;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.25);
            font-weight: 700;
        }

        .tab-btn.hot-btn.active {
            background-color: var(--hot-color);
            border-color: var(--hot-color);
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.25);
            font-weight: 700;
        }

        .tab-btn.cold-btn.active {
            background-color: var(--cold-color);
            border-color: var(--cold-color);
            color: #fff;
            box-shadow: 0 0 15px rgba(77, 173, 247, 0.25);
            font-weight: 700;
        }

        /* Container */
        .menu-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .menu-section {
            display: block;
            margin-bottom: 50px;
            transition: opacity 0.4s ease;
        }

        /* Section Titles */
        .section-title {
            text-align: center;
            margin: 30px 0 35px;
            position: relative;
            padding-bottom: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .section-title span.ku-title {
            font-size: 2.3rem;
            font-weight: bold;
        }

        .section-title span.en-title {
            font-size: 1.05rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            width: 80px;
            height: 3px;
            border-radius: 2px;
        }

        .hot-section .section-title::after {
            background-color: var(--hot-color);
        }

        .cold-section .section-title::after {
            background-color: var(--cold-color);
        }

        /* Grid Layout */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        /* Category Card (Vertical Layout) */
        .category-card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            display: flex; 
            flex-direction: column; /* Vertical stack */
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(212, 175, 55, 0.08);
            border-color: rgba(212, 175, 55, 0.25);
        }

        .category-image {
            width: 100%;
            height: 175px;
            object-fit: cover;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .category-card:hover .category-image {
            opacity: 0.95;
        }

        .category-content {
            width: 100%;
            padding: 22px;
        }

        .category-header {
            font-size: 1.25rem;
            color: var(--primary-color);
            margin-bottom: 20px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }

        body.day-mode .category-header {
            border-bottom: 1px dashed rgba(0, 0, 0, 0.1);
        }

        /* Menu Items */
        .menu-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .item-name {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-light);
            white-space: nowrap;
        }

        .item-dots {
            flex-grow: 1;
            border-bottom: 2px dotted rgba(255, 255, 255, 0.15);
            margin: 0 10px;
            position: relative;
            top: 2px;
        }

        body.day-mode .item-dots {
            border-bottom: 2px dotted rgba(0, 0, 0, 0.15);
        }

        .item-price {
            font-weight: 700;
            color: var(--primary-color);
            font-size: 1rem;
            white-space: nowrap;
        }

        /* iOS Bottom Sheet Settings Drawer */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: flex-end; 
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.open {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: var(--modal-bg);
            border-top: 2px solid var(--primary-color);
            border-left: 1px solid var(--modal-border);
            border-right: 1px solid var(--modal-border);
            border-bottom: none;
            border-radius: 30px 30px 0 0; 
            width: 100%;
            max-width: 500px;
            padding: 20px 25px 30px;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
            transform: translateY(100%); 
            transition: transform 0.3s cubic-bezier(0.1, 0.76, 0.55, 0.94);
        }

        .modal-overlay.open .modal-content {
            transform: translateY(0);
        }

        /* iOS drag bar on top of bottom sheet */
        .sheet-handle {
            width: 45px;
            height: 5px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            margin: 0 auto 15px;
        }

        body.day-mode .sheet-handle {
            background: rgba(0, 0, 0, 0.15);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        body.day-mode .modal-header {
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }

        .modal-header h3 {
            font-size: 1.45rem;
            color: var(--primary-color);
        }

        .close-btn {
            font-size: 1.8rem;
            cursor: pointer;
            color: var(--text-muted);
            transition: color 0.3s ease;
        }

        .close-btn:hover {
            color: var(--primary-color);
        }

        .setting-group {
            margin-bottom: 22px;
        }

        .setting-group label {
            display: block;
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: var(--text-light);
            font-weight: 500;
        }

        .lang-options, .theme-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .lang-opt, .theme-opt {
            background: var(--btn-inactive);
            border: 1px solid var(--btn-inactive-border);
            color: var(--text-light);
            padding: 12px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 500;
            font-size: 1rem;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .lang-opt:hover, .theme-opt:hover {
            border-color: var(--primary-color);
            background: rgba(212, 175, 55, 0.05);
        }

        .lang-opt.active, .theme-opt.active {
            background: var(--primary-color);
            color: #000 !important;
            border-color: var(--primary-color);
            font-weight: 700;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .close-modal-btn {
            background: var(--primary-color);
            color: #000;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .close-modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }

        /* Footer */
        footer {
            margin-top: 80px;
            padding: 40px 20px;
            background-color: rgba(3, 2, 6, 0.85);
            text-align: center;
            border-top: 1px solid rgba(212, 175, 55, 0.15);
        }

        body.day-mode footer {
            background-color: rgba(0, 0, 0, 0.03);
            border-top: 1px solid rgba(0, 0, 0, 0.08);
        }

        .footer-logo {
            font-family: 'Poppins', sans-serif;
            font-size: 1.6rem;
            color: var(--primary-color);
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .designer-info {
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.8;
        }

        .designer-info span {
            color: var(--primary-color);
            font-weight: bold;
            font-family: 'Poppins', sans-serif;
        }

        .contact-link {
            color: var(--text-light);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
            background: rgba(255, 255, 255, 0.04);
            padding: 10px 22px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
        }

        body.day-mode .contact-link {
            background: rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        .contact-link:hover {
            background: var(--primary-color);
            color: #000;
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }

        /* Responsive Mobile Layout adjustment */
        @media (max-width: 768px) {
            .logo-area h1 {
                font-size: 2.4rem;
            }
            .nav-tabs {
                flex-direction: row;
                gap: 6px; /* Tight and neat gaps */
            }
            .tab-btn {
                padding: 6px 12px; /* Super compact buttons on mobile */
                font-size: 0.8rem; 
                flex: 1;
                justify-content: center;
            }
        }
    </style>
</head>
<body class="rtl-layout">

    <div class="top-bar">

    </div>

    <!-- ================= SETTINGS BOTTOM SHEET MODAL ================= -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-content">
            <!-- iOS Drag Handle -->
            <div class="sheet-handle"></div>
            
            <div class="modal-header">
                <h3 class="ku-text" id="setting-title-text">ڕێکخستن</h3>
                <span class="close-btn" onclick="closeSettings()">&times;</span>
            </div>
            <div class="modal-body">
                <!-- Language Choices -->
                <div class="setting-group">
                    <label class="ku-text" id="lang-label">زمان / Language</label>

                        <button class="lang-opt ku-text" onclick="setLanguage('bad')">بادینی</button>

                </div>
                <!-- Night/Day Mode Theme Choices -->
                <div class="setting-group">
                    <label class="ku-text" id="theme-label">دیمەن / Theme</label>

                        <button class="theme-opt ku-text" onclick="setTheme('day')">
                            <i class="fa-solid fa-sun"></i> <span id="theme-day-text">دۆخی ڕۆژێ</span>
                        </button>
                        <button class="theme-opt ku-text active" onclick="setTheme('night')">
                            <i class="fa-solid fa-moon"></i> <span id="theme-night-text">دۆخی شەڤێ</span>
                        </button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="close-modal-btn ku-text" id="close-btn-text" onclick="closeSettings()">داخستن</button>
            </div>
        </div>
    </div>

    <!-- ================= FOOTER ================= -->
    <footer>
        <p class="footer-logo">TAJ COFFEE</p>
        <div class="designer-info ku-text">

                <i class="fa-solid fa-phone"></i> 07507100238

        </div>
    </footer>

            const coldSection = document.getElementById('cold-drinks');

                hotSection.style.display = 'block';
                coldSection.style.display = 'block';

                coldSection.style.display = 'none';
            } else if (category === 'cold') {
